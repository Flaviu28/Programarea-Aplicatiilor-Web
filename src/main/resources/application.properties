spring.application.name=fitness-shop

# Conexiunea la PostgreSQL din Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/paw
spring.datasource.username=paw
spring.datasource.password=paw

# Hibernate & Flyway
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true

# Thymeleaf
spring.thymeleaf.cache=false
server.error.include-message=always

# Mesaje din Lab 1
app.nume=Fitness Shop
app.mesaj.comanda=Comanda pentru echipament a fost inregistrata la:
